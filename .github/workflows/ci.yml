name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout and the Go toolchain are all this needs; anything more is a token
# handed to every action in the job for no reason.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt drift in:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # staticcheck, pinned: @latest would let an upstream release turn an
      # unrelated PR red.
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: staticcheck
        run: staticcheck ./...

      - name: go test (race)
        run: go test -race ./...

      - name: go build
        run: go build -o /tmp/efferent .
